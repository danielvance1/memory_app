<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Memodeum logo">
  <!-- A square orange tile with a route through a memory palace: five stops joined by a path that
       zigzags into an "M". Square corners and a flat dark inner edge to match the app's industrial look. -->
  <rect width="32" height="32" fill="#bf6b17"/>
  <path d="M9 23V9l7 8 7-8v14" fill="none" stroke="#f3dcc2" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="6.3" y="20.3" width="5.4" height="5.4" fill="#fff"/>
  <rect x="6.3" y="6.3" width="5.4" height="5.4" fill="#fff"/>
  <rect x="13.3" y="14.3" width="5.4" height="5.4" fill="#fff"/>
  <rect x="20.3" y="6.3" width="5.4" height="5.4" fill="#fff"/>
  <rect x="20.3" y="20.3" width="5.4" height="5.4" fill="#fff"/>
</svg>
