<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first: render at the phone's real width, and let the page
         extend under the notch / home bar (we pad for it in CSS). -->
    <!-- interactive-widget: when the on-screen keyboard opens, shrink the page to the room left
         (so the fixed header stays put) instead of sliding the whole page up. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#151719" />
    <!-- The logo (public/logo.svg), also used as the browser tab icon. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Memodeum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
