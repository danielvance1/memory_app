# Checks that run on every pull request (and on pushes to main).
# If any job fails, the PR shows a red X and you know before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Runs the server's automated tests against a real PostgreSQL database.
  server-tests:
    name: Server tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memodeum
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: memodeum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memodeum -d memodeum_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://memodeum:ci-password@localhost:5432/memodeum_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    name: Client typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the real production image and boots it against a real Postgres,
  # so a broken Dockerfile or a broken startup is caught before it deploys.
  docker:
    name: Docker image boots and serves
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memodeum
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: memodeum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memodeum -d memodeum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t memodeum-app:ci .

      - name: Start container
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://memodeum:ci-password@localhost:5432/memodeum \
            memodeum-app:ci

      - name: Smoke test
        run: |
          set -euo pipefail
          echo "API health (retries while the app starts):"
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused \
            http://localhost:3000/api/health | tee /dev/stderr | grep -q '"database":"up"'
          echo
          echo "Home page and a deep link both return the React shell:"
          curl --fail --silent --show-error http://localhost:3000/ | grep -q 'id="root"'
          curl --fail --silent --show-error http://localhost:3000/some/deep/link | grep -q 'id="root"'
          echo "Unknown API routes return 404:"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/nope)" = "404"

          # Accounts, inside the real production image. This is the check that the
          # password-hashing library has a working build for the Alpine Linux image,
          # and that the migrations were included in it.
          echo "Sign up, then use the session cookie:"
          curl --fail-with-body --silent --show-error --cookie-jar jar.txt \
            --header 'content-type: application/json' \
            --data '{"username":"smoke_test","email":"smoke@example.com","password":"smoke-test-password"}' \
            http://localhost:3000/api/auth/signup | tee /dev/stderr | grep -q '"username":"smoke_test"'
          echo
          curl --fail --silent --show-error --cookie jar.txt http://localhost:3000/api/auth/me \
            | tee /dev/stderr | grep -q '"username":"smoke_test"'
          echo
          echo "Not an admin yet, so the admin list is refused:"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie jar.txt http://localhost:3000/api/admin/users)" = "403"
          echo "Promote with the make-admin script that ships in the image, then the list works:"
          docker exec smoke node server/dist/scripts/make-admin.js smoke_test
          curl --fail --silent --show-error --cookie jar.txt http://localhost:3000/api/admin/users \
            | tee /dev/stderr | grep -q '"email":"smoke@example.com"'
          echo
          echo "Log out, and the cookie stops working:"
          curl --fail --silent --show-error --cookie jar.txt --request POST http://localhost:3000/api/auth/logout
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie jar.txt http://localhost:3000/api/admin/users)" = "401"

      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke
