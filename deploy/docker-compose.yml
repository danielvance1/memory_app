# Production stack, run on the server from ~/memodeum by deploy/remote-deploy.sh.
# Three containers: Postgres (db), the app (API + React), and Caddy (HTTPS).
name: memodeum

# Keep container logs from slowly filling the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: memodeum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: memodeum
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose: only other containers can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memodeum -d memodeum"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: memodeum-app:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://memodeum:${POSTGRES_PASSWORD}@db:5432/memodeum
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # stores the HTTPS certificates; keep it
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
